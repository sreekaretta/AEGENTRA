version: '3.8'

services:
  flask-app:
    build: .
    container_name: aegentra-minimal-flask
    ports:
      - "8086:8086"
    environment:
      - FLASK_ENV=development
    networks:
      - aegentra-net

  nginx:
    image: nginx:alpine
    container_name: aegentra-minimal-nginx
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app

networks:
  aegentra-net:
    driver: bridge
