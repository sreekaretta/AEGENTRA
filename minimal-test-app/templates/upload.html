<!DOCTYPE html>
<html>
<head>
    <title>Upload - AEGENTRA Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .vuln { background: #f8d7da; padding: 15px; margin: 10px 0; border: 1px solid #f5c6cb; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        button { width: 100%; padding: 10px; background: #dc3545; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>File Upload</h2>
        
        <div class="vuln">
            <h3>Vulnerability 6: Arbitrary File Upload</h3>
            <p><strong>No file type validation</strong></p>
            <p><strong>No file size limits</strong></p>
            <p><strong>Files saved to uploads directory</strong></p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label for="file">Choose file to upload:</label><br>
            <input type="file" name="file" id="file"><br><br>
            <button type="submit">Upload File</button>
        </form>

        <p><strong>Test files:</strong></p>
        <ul>
            <li>Upload .php file (web shell)</li>
            <li>Upload .html file (XSS)</li>
            <li>Upload .exe file (malware)</li>
            <li>Upload large file (DoS)</li>
        </ul>

        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
