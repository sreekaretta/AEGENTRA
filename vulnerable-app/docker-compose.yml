version: '3.8'

services:
  vulnerable-app:
    build: .
    container_name: aegentra-vulnerable-app
    ports:
      - "8085:8085"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0